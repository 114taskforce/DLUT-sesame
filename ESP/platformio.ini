[env:campusnet]
platform = espressif32@6.9.0 
board = esp32-s3-devkitc-1
framework = arduino

; Flash 配置(16MB 版本开发板)
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; ============ 关键：不使用 PSRAM ============
; 板级默认 memory_type = qio_qspi(quad PSRAM 模式):
; ESP32-S3 只有 octal(OPI) PSRAM 才能映射进堆, quad 模式下堆永远只用内部 RAM,
; 所以此配置下 malloc 全部落在内部 RAM(320KB)。
; 曾启用 qio_opi+PSRAM: malloc 大块会落 PSRAM, 而 mbedTLS 硬件 AES/SHA/RSA 走 DMA
; 无法访问 PSRAM, 导致 TLS 阶段堆损坏(CORRUPT HEAP, 崩在 esp_aes_process_dma)。
; 320KB 内部 RAM 对本项目(峰值约 250KB)足够。
build_flags =
    -DARDUINO_LOOP_STACK_SIZE=32768    ; 增大 loop 任务栈到 32KB(默认 8KB)

monitor_speed = 115200
